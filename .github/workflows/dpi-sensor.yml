name: Build & Publish the DPI sensor

# The IPS page's sensor (dpi-sensor/) is its own image, so a router pulls a few
# megabytes rather than MikroDash. A `dpi-v*` tag publishes it; a push to main
# that touches it builds every architecture and publishes nothing.

on:
  push:
    branches:
      - main
    paths:
      - 'dpi-sensor/**'
      - '.github/workflows/dpi-sensor.yml'
    tags:
      - 'dpi-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lower case, and an owner need not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mikrodash-dpi" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=match,pattern=dpi-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/dpi-v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: dpi-sensor
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/dpi-v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The sensor reports it in its hello; MikroDash compares it with the
          # registry's newest tag to offer an update.
          build-args: |
            SENSOR_BUILD=${{ steps.meta.outputs.version }}
